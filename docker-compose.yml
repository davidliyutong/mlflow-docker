# MLflow tracking stack: MySQL (metadata) + RustFS (S3-compatible artifacts)
# + MLflow tracking server.
#
# Copy .env.example to .env to adjust ports, credentials and security knobs.
# See docs/deployment.md for production guidance.

x-mlflow-image: &mlflow-image
  build:
    context: .
    args:
      VERSION: ${MLFLOW_VERSION:-3.17.1}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12.13}
      OIDC_AUTH_VERSION: ${MLFLOW_OIDC_AUTH_VERSION:-11.0.0}
  image: ${MLFLOW_IMAGE:-ghcr.io/davidliyutong/mlflow-docker:latest}

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    restart: unless-stopped
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mlflow}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mlflowdb}
      MYSQL_USER: ${MYSQL_USER:-mlflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mlflow}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    command: /data
    ports:
      - "${RUSTFS_BIND_HOST:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_BIND_HOST:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${MLFLOW_S3_ACCESS_KEY:-mlflow}
      RUSTFS_SECRET_KEY: ${MLFLOW_S3_SECRET_KEY:-mlflowpassword}
      RUSTFS_CONSOLE_ENABLE: "true"

  rustfs-init:
    <<: *mlflow-image
    depends_on:
      - rustfs
    restart: "no"
    entrypoint: ["python", "/opt/mlflow/ensure_bucket.py"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY:-mlflowpassword}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BUCKET_INIT_TIMEOUT: ${BUCKET_INIT_TIMEOUT:-90}

  mlflow:
    <<: *mlflow-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_HOST_PORT:-8080}:8080"
    volumes:
      - mlflow_data:/data
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mlflowdb}
      MYSQL_USER: ${MYSQL_USER:-mlflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mlflow}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      # Set to use an external database instead of the bundled MySQL service.
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:-}
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET:-mlflow}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-}
      MLFLOW_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:-}
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-}
      # OIDC authentication (mlflow-oidc-auth); enabled when OIDC_DISCOVERY_URL
      # is set. See docs/oidc.md for the full variable reference.
      MLFLOW_APP_NAME: ${MLFLOW_APP_NAME:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-}
      OIDC_PROVIDER_DISPLAY_NAME: ${OIDC_PROVIDER_DISPLAY_NAME:-}
      OIDC_USERNAME_FIELD: ${OIDC_USERNAME_FIELD:-}
      OIDC_GROUP_NAME: ${OIDC_GROUP_NAME:-}
      OIDC_GROUP_NAME_PATTERN: ${OIDC_GROUP_NAME_PATTERN:-}
      OIDC_ADMIN_GROUP_NAME: ${OIDC_ADMIN_GROUP_NAME:-}
      OIDC_PUBLIC_CLIENT: ${OIDC_PUBLIC_CLIENT:-}
      OIDC_USERS_DB_URI: ${OIDC_USERS_DB_URI:-}
      DEFAULT_MLFLOW_PERMISSION: ${DEFAULT_MLFLOW_PERMISSION:-}
      AUTOMATIC_LOGIN_REDIRECT: ${AUTOMATIC_LOGIN_REDIRECT:-}
      SECRET_KEY: ${SECRET_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY:-mlflowpassword}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

volumes:
  db_data:
  rustfs_data:
  mlflow_data:
