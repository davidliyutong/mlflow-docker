name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. 3.12.0 or 3.12.0-hotfix1)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  verify:
    name: Verify (compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start the stack
        run: make up
      - name: Run the smoke test
        run: make smoke
      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
      - name: Tear down the stack
        if: always()
        run: make clean

  verify-oidc:
    name: Verify OIDC (compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start the OIDC demo stack
        run: make up-oidc
      - name: Run the OIDC smoke test
        run: make smoke-oidc
      - name: Collect compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.oidc.yml \
            logs --no-color > /tmp/oidc-compose-logs.txt
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-compose-logs
          path: /tmp/oidc-compose-logs.txt
      - name: Tear down the stack
        if: always()
        run: make clean

  publish:
    name: Publish to GHCR
    needs: [verify, verify-oidc]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish variables
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="$(make --no-print-directory print-VERSION)"
          PYTHON_VERSION="$(make --no-print-directory print-PYTHON_VERSION)"
          OIDC_AUTH_VERSION="$(make --no-print-directory print-OIDC_AUTH_VERSION)"
          if [ -z "$VERSION" ] || [ -z "$PYTHON_VERSION" ] || [ -z "$OIDC_AUTH_VERSION" ]; then
            echo "Missing VERSION, PYTHON_VERSION or OIDC_AUTH_VERSION in Makefile" >&2
            exit 1
          fi

          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          TARGET_IMAGE="$REGISTRY/$IMAGE_NAME_LOWER"

          if [ "$EVENT_NAME" = "release" ]; then
            TAGS=(
              "$TARGET_IMAGE:$RELEASE_TAG"
              "$TARGET_IMAGE:$VERSION"
              "$TARGET_IMAGE:latest"
            )
          else
            TAGS=("$TARGET_IMAGE:$INPUT_IMAGE_TAG")
          fi

          {
            echo "version=$VERSION"
            echo "python_version=$PYTHON_VERSION"
            echo "oidc_auth_version=$OIDC_AUTH_VERSION"
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            PYTHON_VERSION=${{ steps.vars.outputs.python_version }}
            OIDC_AUTH_VERSION=${{ steps.vars.outputs.oidc_auth_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
