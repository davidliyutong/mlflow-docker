name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version pins
        run: make check-versions
      - name: Lint
        run: make lint

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start the stack
        run: make up
      - name: Run the smoke test
        run: make smoke
      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color > /tmp/compose-logs.txt
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt
      - name: Tear down the stack
        if: always()
        run: make clean

  smoke-oidc:
    name: OIDC compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start the OIDC demo stack
        run: make up-oidc
      - name: Run the OIDC smoke test
        run: make smoke-oidc
      - name: Collect compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.oidc.yml \
            logs --no-color > /tmp/oidc-compose-logs.txt
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-compose-logs
          path: /tmp/oidc-compose-logs.txt
      - name: Tear down the stack
        if: always()
        run: make clean
